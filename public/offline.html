<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">

  <meta name="theme-color" content="#75201d">
  <title>Offline | Sweet Rascal</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom)); font: 16px/1.55 system-ui, sans-serif; background: #f9f5f2; color: #2c2220; }
    main { width: min(100%, 420px); border: 1px solid #eee2dd; border-top: 4px solid #75201d; border-radius: 18px; background: white; padding: 24px; }
    h1 { font: italic 650 2rem/1.15 Georgia, serif; margin: 8px 0; }
    p { margin: 0 0 18px; }
    strong { color: #75201d; }
    a { display: inline-flex; align-items: center; min-height: 44px; color: white; background: #a9342b; border-radius: 9px; padding: 8px 15px; font-weight: 650; }
  </style>
</head>
<body>
  <main>
    <strong>Sweet Rascal · Yercaud</strong>
    <h1>You're offline</h1>
    <p>Reconnect to open the workspace and resume orders or billing.</p>
    <a href="/">Retry connection</a>
  </main>

</html>
